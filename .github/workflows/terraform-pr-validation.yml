name: CI - Pull Request Validation (Tests, Docker Build & Terraform Plan)

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ====================================================
  # JOB 1: CI CODE TEST & DOCKER IMAGE BUILD VALIDATION
  # ====================================================
  ci-build-and-test:
    name: 🧪 CI - Run Unit Tests & Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Backend xUnit Unit Tests
        run: dotnet test backend/tests/DeliveryTracker.Api.Tests/DeliveryTracker.Api.Tests.csproj

      - name: 🐳 Test Build Backend Docker Image (CI Validation)
        run: docker build -t deliverytracker-backend:test ./backend

      - name: 🐳 Test Build Frontend Docker Image (CI Validation)
        run: docker build -t deliverytracker-frontend:test ./frontend

  # ====================================================
  # JOB 2: TERRAFORM LINT & PLAN
  # ====================================================
  terraform-plan:
    name: 📋 CI - Terraform Format, Validate & Plan
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, uat, prod]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (${{ matrix.environment }})
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Validate (${{ matrix.environment }})
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan (${{ matrix.environment }})
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: terraform plan -no-color -var="environment=${{ matrix.environment }}"
