name: Terraform PR Validation (Plan & Lint)

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, uat, prod]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (${{ matrix.environment }})
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Validate (${{ matrix.environment }})
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan (${{ matrix.environment }})
        id: plan
        working-directory: ./terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=tfplan-${{ matrix.environment }} -var="environment=${{ matrix.environment }}"

      - name: Post Plan to PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const output = `#### Terraform Plan Status (${env.toUpperCase()}): \`Success\` 🤖
            *Pusher: @${{ github.actor }}*
            *Action: \`${{ github.event_name }}\`*

            <details><summary>Show Plan (${env})</summary>

            \`\`\`hcl
            Terraform plan generated successfully for ${env}.
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
