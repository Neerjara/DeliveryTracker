name: GitHub Actions Infrastructure & Microservices CD (DEV -> UAT -> PROD)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ====================================================
  # JOB 1: TEST & SCAN (CI)
  # ====================================================
  ci-test:
    name: 🧪 Run Unit Tests & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run xUnit Unit Tests
        run: dotnet test backend/tests/DeliveryTracker.Api.Tests/DeliveryTracker.Api.Tests.csproj

  # ====================================================
  # JOB 2: DEPLOY DEV (INFRASTRUCTURE + DOCKER BUILD & PUSH)
  # ====================================================
  deploy-dev:
    name: 🚀 Build Docker & Deploy DEV
    needs: ci-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # Step 1: Provision ACR and Base Infra via Terraform
      - name: Terraform Init & Apply Base Infra (DEV)
        working-directory: ./terraform/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve -var="environment=dev"

      # Step 2: Log in to Azure Container Registry
      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: crdeliverytrackerdev01.azurecr.io
          username: ${{ secrets.ACR_DEV_USERNAME }}
          password: ${{ secrets.ACR_DEV_PASSWORD }}

      # Step 3: Build & Push Backend Docker Image
      - name: Build & Push Backend Docker Image (DEV)
        run: |
          docker build -t crdeliverytrackerdev01.azurecr.io/deliverytracker-backend:${{ github.sha }} -t crdeliverytrackerdev01.azurecr.io/deliverytracker-backend:latest ./backend
          docker push crdeliverytrackerdev01.azurecr.io/deliverytracker-backend:${{ github.sha }}
          docker push crdeliverytrackerdev01.azurecr.io/deliverytracker-backend:latest

      # Step 4: Build & Push Frontend Docker Image
      - name: Build & Push Frontend Docker Image (DEV)
        run: |
          docker build -t crdeliverytrackerdev01.azurecr.io/deliverytracker-frontend:${{ github.sha }} -t crdeliverytrackerdev01.azurecr.io/deliverytracker-frontend:latest ./frontend
          docker push crdeliverytrackerdev01.azurecr.io/deliverytracker-frontend:${{ github.sha }}
          docker push crdeliverytrackerdev01.azurecr.io/deliverytracker-frontend:latest

      # Step 5: Update Container Apps with new Docker Image Tags
      - name: Deploy Container Apps with Built Images (DEV)
        working-directory: ./terraform/environments/dev
        run: |
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="backend_image=crdeliverytrackerdev01.azurecr.io/deliverytracker-backend:${{ github.sha }}" \
            -var="frontend_image=crdeliverytrackerdev01.azurecr.io/deliverytracker-frontend:${{ github.sha }}"

  # ====================================================
  # JOB 3: DEPLOY UAT (INFRASTRUCTURE + DOCKER BUILD & PUSH)
  # ====================================================
  deploy-uat:
    name: 🧪 Build Docker & Deploy UAT
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply Base Infra (UAT)
        working-directory: ./terraform/environments/uat
        run: |
          terraform init
          terraform apply -auto-approve -var="environment=uat"

      - name: Log in to ACR (UAT)
        uses: azure/docker-login@v1
        with:
          login-server: crdeliverytrackeruat01.azurecr.io
          username: ${{ secrets.ACR_UAT_USERNAME }}
          password: ${{ secrets.ACR_UAT_PASSWORD }}

      - name: Build & Push Images (UAT)
        run: |
          docker build -t crdeliverytrackeruat01.azurecr.io/deliverytracker-backend:${{ github.sha }} ./backend
          docker push crdeliverytrackeruat01.azurecr.io/deliverytracker-backend:${{ github.sha }}
          docker build -t crdeliverytrackeruat01.azurecr.io/deliverytracker-frontend:${{ github.sha }} ./frontend
          docker push crdeliverytrackeruat01.azurecr.io/deliverytracker-frontend:${{ github.sha }}

      - name: Deploy Container Apps with Built Images (UAT)
        working-directory: ./terraform/environments/uat
        run: |
          terraform apply -auto-approve \
            -var="environment=uat" \
            -var="backend_image=crdeliverytrackeruat01.azurecr.io/deliverytracker-backend:${{ github.sha }}" \
            -var="frontend_image=crdeliverytrackeruat01.azurecr.io/deliverytracker-frontend:${{ github.sha }}"

  # ====================================================
  # JOB 4: DEPLOY PROD (INFRASTRUCTURE + DOCKER BUILD & PUSH)
  # ====================================================
  deploy-prod:
    name: 🛡️ Build Docker & Deploy PROD
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: production # Manual Approval Gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply Base Infra (PROD)
        working-directory: ./terraform/environments/prod
        run: |
          terraform init
          terraform apply -auto-approve -var="environment=prod"

      - name: Log in to ACR (PROD)
        uses: azure/docker-login@v1
        with:
          login-server: crdeliverytrackerprod01.azurecr.io
          username: ${{ secrets.ACR_PROD_USERNAME }}
          password: ${{ secrets.ACR_PROD_PASSWORD }}

      - name: Build & Push Images (PROD)
        run: |
          docker build -t crdeliverytrackerprod01.azurecr.io/deliverytracker-backend:${{ github.sha }} ./backend
          docker push crdeliverytrackerprod01.azurecr.io/deliverytracker-backend:${{ github.sha }}
          docker build -t crdeliverytrackerprod01.azurecr.io/deliverytracker-frontend:${{ github.sha }} ./frontend
          docker push crdeliverytrackerprod01.azurecr.io/deliverytracker-frontend:${{ github.sha }}

      - name: Deploy Container Apps with Built Images (PROD)
        working-directory: ./terraform/environments/prod
        run: |
          terraform apply -auto-approve \
            -var="environment=prod" \
            -var="backend_image=crdeliverytrackerprod01.azurecr.io/deliverytracker-backend:${{ github.sha }}" \
            -var="frontend_image=crdeliverytrackerprod01.azurecr.io/deliverytracker-frontend:${{ github.sha }}"
