deliverytracker_profile:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: main
      schema: dev_delivery_db
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-123456789.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/abcdef123456') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'dapi_sample_token') }}"

    uat:
      type: databricks
      catalog: main
      schema: uat_delivery_db
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-123456789.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/abcdef123456') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'dapi_sample_token') }}"

    prod:
      type: databricks
      catalog: main
      schema: prod_delivery_db
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-123456789.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/abcdef123456') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'dapi_sample_token') }}"
